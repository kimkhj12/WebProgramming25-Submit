<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>drama</title>
  <!-- 구글 폰트 불러오기 -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&family=Nanum+Myeongjo&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nanum Gothic', sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    h1 {
      font-family: 'Nanum Gothic', sans-serif;
      text-align: center;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .card {
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card h3 {
      margin-top: 0;
      font-family: 'Nanum Gothic', sans-serif;
      font-size: 25px;
      color: #1e73be; 
      text-align: center;
    }
    .card img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 16px auto; /* 이미지 자체도 가운데 배치 */
      border-radius: 6px;
    }
    .card p {
      font-family: 'Nanum Gothic', serif;
      font-size: 16px;
      color: #000000;
      line-height: 1.8;
    }
    /* 카드별 색상 */
    .card:nth-child(1) { background: #dbeafe; } /* 연한 블루 */
    .card:nth-child(2) { background: #fef9c3; } /* 연한 노랑 */
    .card:nth-child(3) { background: #fed7aa; } /* 연한 주황 */
    .card:nth-child(4) { background: #bbf7d0; } /* 연한 초록 */

    /* 반응형 */
    @media (max-width: 900px) {
      .container { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .container { grid-template-columns: 1fr; }
    }
    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 14px;
      color: #000000;
    }
    footer a {
      font-size: 20px; 
      font-weight: bold; 
      color: #ff5733;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
   <h1>[미디어관] 해킹이 드라마에 미친 영향</h1>
  <div class="container">
    <div class="card">
      <h3>드라마에 미친 주요 영향</h3>
      <p><img src="images/drama1.png" alt="드라마 영향">
                      
        <span style="color: #1e73be; font-size:20px;">[드라마적 영향]</span><br>
       
        <span style="color: #1e73be; font-size:20px;">[사회적 파급 효과]</span><br>
        
     </p>
    </div>
    <div class="card">
      <h3>드라마  'Mr. Robot'</h3>
      <p><img src="images/drama2.png" alt="mr robot">
        
        <span style="color: #1e73be; font-size:20px;">[드라마적 의의]</span><br>
        
      </p>
    </div>
    <div class="card">
      <h3>드라마 '유령'</h3>
      <p><img src="images/drama3.png" alt="유령">
        
        <span style="color: #1e73be; font-size:20px;">[드라마적 의의]</span><br>
          
      </p>
    </div>
    <div class="card">
      <h3>드라마 'CSI: Cyber'</h3>      
      <p><img src="images/drama4.png" alt="csi cyber">
        
        <span style="color: #1e73be; font-size:20px;">[줄거리]</span><br>
        
      </p>
    </div>
  </div>
  <footer>
    <a href="media.html">← 메뉴로 돌아가기</a>
    <p>© <time datetime="2025">2025</time> 해킹 역사 박물관</p>
  </footer>
</body>

</html>
