<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해킹 연대기 - 해킹 역사 박물관</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Nanum+Gothic&family=Nanum+Myeongjo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .logo-title {
      display: flex;
      align-items: center;
      justify-content: center; /* 가운데 정렬 */
      gap: 10px; /* 로고와 제목 사이 간격 */
       margin: 20px 0;
    }

/* 로고 크기 */
   #site-logo {
     width: 60px;
     height: auto;
   }
   #site-title {
     font-family: 'Nanum Pen Script', cursive;
     font-size: 3.5rem;
     color: #009988;
   }
    /* 추가된 스타일 */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2열 */
      gap: 20px; /* 이미지 간격 */
      max-width: 800px;
      margin: 0 auto;
    }
    .image-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px; /* 선택: 모서리 둥글게 */
    }
  </style>
</head>
<body>
  <header>
     <!-- 사이트 제목 추가 -->

      <a href="index.html">해킹 역사 박물관</a>
    </div>
    <h1>해킹 연대기</h1>
   
  </header>

  <main>
  <div class="image-grid">
    <a href="1960s.html">
      <img src="images/1960.png" alt="1960년~70년대">
    </a>
    <a href="1980s.html">
      <img src="images/1980.png" alt="1980~90년대">
    </a>
    <a href="2000s.html">
      <img src="images/2000.png" alt="2000년대 이후">
    </a>
    <a href="hackingcase.html">
      <img src="images/hackingcase.png" alt="대표 사건">
    </a>
  </div>
 </main>

  <footer>
    <p>© <time datetime="2025">2025</time> 해킹 역사 박물관</p>

  </footer>
</body>
</html>
