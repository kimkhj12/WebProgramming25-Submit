<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해킹 연대기 - 해킹 역사 박물관</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Nanum+Gothic&family=Nanum+Myeongjo&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>해킹 연대기</h1>
    <!-- 홈으로 돌아가기 링크 -->
    <nav>
      <a href="index.html">← 메인 홈페이지로 돌아가기</a>
    </nav>
  </header>

  <main class="card-layout">
  <div class="cards">
    <div class="card">
      <img src="images/1960.png" alt="1960년~70년대">
    </div>

    <div class="card">
      <img src="images/1980.png" alt="1980~90년대">
    </div>

    <div class="card">
      <img src="images/2000.png" alt="2000년대 이후">
    </div>

    <div class="card">
      <img src="images/hackingcase.png" alt="대표 사건">
    </div>
  </div>
</main>

  <footer>
    <p>© <time datetime="2025">2025</time> 해킹 역사 박물관</p>
    <!-- 푸터에도 홈 링크 추가 가능 -->
    <p><a href="index.html">메인 홈페이지로 돌아가기</a></p>
  </footer>

</html>
