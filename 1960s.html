<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>1960s</title>
  <!-- 구글 폰트 불러오기 -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&family=Nanum+Myeongjo&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nanum Gothic', sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    h1 {
      font-family: 'Nanum Gothic', sans-serif;
      text-align: center;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .card {
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card h3 {
      margin-top: 0;
      font-family: 'Nanum Gothic', sans-serif;
      font-size: 25px;
      color: #1e73be; 
    }
    .card p {
      font-family: 'Nanum Gothic', serif;
      font-size: 16px;
      color: #000000;
    }
    /* 카드별 색상 */
    .card:nth-child(1) { background: #dbeafe; } /* 연한 블루 */
    .card:nth-child(2) { background: #fef9c3; } /* 연한 노랑 */
    .card:nth-child(3) { background: #fed7aa; } /* 연한 주황 */
    .card:nth-child(4) { background: #bbf7d0; } /* 연한 초록 */

    /* 반응형 */
    @media (max-width: 900px) {
      .container { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .container { grid-template-columns: 1fr; }
    }
    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 14px;
      color: #000000;
    }
    footer a {
      font-size: 20px; 
      font-weight: bold; 
      color: #ff5733;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>1960~70년대</h1>
  <div class="container">
    <div class="card">
      <h3>개요</h3>
      <p>1960~70년대 해킹은 범죄보다 '호기심과 창의성'에서 시작된 기술 실험의 시대였습니다. 
        이 시기의 해킹은 오늘날의 사이버 범죄와는 달리, 기술적 장난과 시스템 탐구에 가까웠습니다.
     </p>
    </div>
    <div class="card">
      <h3>카드 2</h3>
      <p>간단한 설명이나 텍스트를 넣어보세요.</p>
    </div>
    <div class="card">
      <h3>카드 3</h3>
      <p>반응형으로 화면 크기에 맞게 정렬됩니다.</p>
    </div>
    <div class="card">
      <h3>카드 4</h3>
      <p>원하는 내용을 자유롭게 작성하세요.</p>
    </div>
  </div>
  <footer>
    <a href="chronology.html">← 메뉴로 돌아가기</a>
    <p>© <time datetime="2025">2025</time> 해킹 역사 박물관</p>
  </footer>
</body>

</html>
