<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1960~70년대</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --ring: #93c5fd33;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(1200px 600px at 20% 10%, #0b1224 0%, var(--bg) 50%, #0a1020 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      border-bottom: 1px solid #ffffff18;
      padding-bottom: 18px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .actions {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid #ffffff1a;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: transform .08s ease, background .15s ease, border-color .15s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: #ffffff33; }
    .btn.accent { background: #172554; border-color: #60a5fa55; color: #bfdbfe; }
    .btn.accent:hover { background: #1e293b; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px)  { .grid { grid-template-columns: 1fr; } }

    .card {
      position: relative;
      background: linear-gradient(180deg, #1f2937cc 0%, #121826 100%);
      border: 1px solid #ffffff12;
      border-radius: 14px;
      padding: 16px 14px;
      min-height: 170px;
      box-shadow: 0 10px 30px #00000055 inset, 0 12px 34px #00000030;
      overflow: hidden;
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #93c5fd33;
      box-shadow: 0 10px 30px #00000055 inset, 0 18px 38px #00000040;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .card .content {
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
      white-space: pre-wrap;
      min-height: 90px;
    }

    /* 편집 상태 시 시각적 링 */
    [contenteditable="true"]:focus {
      outline: none;
      box-shadow: 0 0 0 6px var(--ring);
      border-radius: 8px;
    }

    /* 툴팁 라벨 */
    .label {
      position: absolute;
      top: 10px; right: 12px;
      font-size: 12px;
      color: #93c5fd;
      background: #1e3a8a55;
      border: 1px solid #60a5fa44;
      padding: 2px 8px;
      border-radius: 999px;
    }

    footer {
      margin-top: 26px;
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
    }
    a { color: #93c5fd; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">내 카드 페이지</div>
      <div class="actions">
        <button class="btn accent" id="exportBtn">내보내기(복사)</button>
        <button class="btn" id="resetBtn">초기화</button>
      </div>
    </header>

    <section class="grid" id="grid">
      <!-- 카드 1 -->
      <article class="card" data-key="card-1">
        <span class="label">편집 가능</span>
        <h3 contenteditable="true" spellcheck="false" data-field="title">제목 1</h3>
        <div class="content" contenteditable="true" spellcheck="false" data-field="content">여기에 내용을 입력하세요. 엔터로 줄바꿈이 가능합니다.</div>
      </article>

      <!-- 카드 2 -->
      <article class="card" data-key="card-2">
        <span class="label">편집 가능</span>
        <h3 contenteditable="true" spellcheck="false" data-field="title">제목 2</h3>
        <div class="content" contenteditable="true" spellcheck="false" data-field="content">설명, 메모, 링크 등 자유롭게 적어보세요.</div>
      </article>

      <!-- 카드 3 -->
      <article class="card" data-key="card-3">
        <span class="label">편집 가능</span>
        <h3 contenteditable="true" spellcheck="false" data-field="title">제목 3</h3>
        <div class="content" contenteditable="true" spellcheck="false" data-field="content">반응형 그리드로 화면 크기에 맞춰 정렬됩니다.</div>
      </article>

      <!-- 카드 4 -->
      <article class="card" data-key="card-4">
        <span class="label">편집 가능</span>
        <h3 contenteditable="true" spellcheck="false" data-field="title">제목 4</h3>
        <div class="content" contenteditable="true" spellcheck="false" data-field="content">텍스트는 브라우저에 자동 저장되어 새로고침해도 유지됩니다.</div>
      </article>
    </section>

    <footer>
      <a href="chronology.html">← 목록으로 돌아가기</a>
      <p>© <time datetime="2025">2025</time> 해킹 역사 박물관</p>
    </footer>
  </div>

  <script>
    // 간단한 로컬 저장소 키
    const STORAGE_KEY = 'cards-v1';

    // 저장된 데이터 불러오기
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    // 상태 저장
    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // 현재 DOM에서 상태 수집
    function collectState() {
      const state = {};
      document.querySelectorAll('.card').forEach(card => {
        const key = card.dataset.key;
        const title = card.querySelector('[data-field="title"]').innerText;
        const content = card.querySelector('[data-field="content"]').innerText;
        state[key] = { title, content };
      });
      return state;
    }

    // 상태를 DOM에 반영
    function applyState(state) {
      document.querySelectorAll('.card').forEach(card => {
        const key = card.dataset.key;
        const data = state[key];
        if (!data) return;
        const titleEl = card.querySelector('[data-field="title"]');
        const contentEl = card.querySelector('[data-field="content"]');
        titleEl.innerText = data.title ?? titleEl.innerText;
        contentEl.innerText = data.content ?? contentEl.innerText;
      });
    }

    // 입력 이벤트 핸들러 (자동 저장)
    function onInput() {
      const state = collectState();
      saveState(state);
    }

    // 내보내기: 현재 내용을 JSON으로 복사
    function exportToClipboard() {
      const json = JSON.stringify(collectState(), null, 2);
      navigator.clipboard.writeText(json).then(() => {
        alert('현재 카드 내용이 클립보드에 복사되었습니다.');
      }).catch(() => {
        alert('복사에 실패했습니다. 브라우저 권한을 확인하세요.');
      });
    }

    // 초기화: 저장소 비우고 기본값으로
    function resetAll() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    // 초기 실행
    (function init() {
      const state = loadState();
      applyState(state);

      document.querySelectorAll('[contenteditable="true"]').forEach(el => {
        el.addEventListener('input', onInput);
      });

      document.getElementById('exportBtn').addEventListener('click', exportToClipboard);
      document.getElementById('resetBtn').addEventListener('click', resetAll);
    })();
  </script>
</body>
</html>
