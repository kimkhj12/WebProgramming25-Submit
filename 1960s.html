<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>1960s</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card h3 {
      margin-top: 0;
      font-size: 18px;
    }
    .card p {
      font-size: 14px;
      color: #555;
    }
    /* 반응형: 화면이 좁아지면 2열 → 1열 */
    @media (max-width: 900px) {
      .container { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>1960~70년대</h1>
  <div class="container">
    <div class="card">
      <h3>카드 1</h3>
      <p>여기에 내용을 적을 수 있습니다.</p>
    </div>
    <div class="card">
      <h3>카드 2</h3>
      <p>간단한 설명이나 텍스트를 넣어보세요.</p>
    </div>
    <div class="card">
      <h3>카드 3</h3>
      <p>반응형으로 화면 크기에 맞게 정렬됩니다.</p>
    </div>
    <div class="card">
      <h3>카드 4</h3>
      <p>원하는 내용을 자유롭게 작성하세요.</p>
    </div>
  </div>
   <footer>
      <a href="blog.html">← 목록으로 돌아가기</a>
     <p>© <time datetime="2025">2025</time> 해킹 역사 박물관</p>
    </footer>
</body>

</html>
